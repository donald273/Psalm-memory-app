<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18343b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Psalm Source">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Psalm Source</title>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand-mark">PS</div>
    <div>
      <div class="kicker">1650 Scottish Psalter</div>
      <h1>Psalm Source</h1>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙︎</button>
  </header>

  <section id="settings" class="panel settings-panel">
    <div class="range-title">Practice range</div>
    <div class="range-grid">
      <label>From
        <select id="fromPsalm"></select>
      </label>
      <label>To
        <select id="toPsalm"></select>
      </label>
    </div>
    <div class="quick-row">
      <button data-range="1-20">1–20</button>
      <button data-range="21-50">21–50</button>
      <button data-range="51-100">51–100</button>
      <button data-range="101-150">101–150</button>
      <button data-range="1-150">All</button>
    </div>
    <button id="startBtn" class="primary wide">Start / New Psalm</button>
  </section>

  <main class="game-card">
    <div id="status" class="status">Choose a range and start</div>
    <article id="psalmText" class="psalm-text">
      <p class="placeholder">Your Psalm will appear here.</p>
    </article>

    <section class="answer-area">
      <label for="answer">What is the source?</label>
      <input id="answer" type="text" inputmode="text" autocomplete="off"
             autocapitalize="sentences" placeholder="e.g. Psalm 23">
      <div class="actions">
        <button id="checkBtn" class="primary">Check answer</button>
        <button id="revealBtn" class="secondary">Reveal answer</button>
      </div>
    </section>

    <div id="result" class="result" hidden></div>
    <button id="nextBtn" class="next" hidden>Next Psalm&nbsp; →</button>
  </main>

  <footer>
    <span id="score">0 correct</span>
    <button id="resetScore" class="text-btn">Reset score</button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
